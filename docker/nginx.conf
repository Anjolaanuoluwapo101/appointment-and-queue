server {
    # Render injects $PORT (default 10000) and routes public traffic to it.
    # The entrypoint rewrites this listen line at container start.
    listen 10000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Laravel health check
    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb websocket traffic shares the single public port:
    # Echo connects to https://<app-host>/app/<key> and nginx
    # upgrades it to the local Reverb server.
    location ~ ^/app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
